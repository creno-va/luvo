name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active migration/deployment before starting the next one.
concurrency:
  group: luvo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Test patient isolation, dose history, and briefing evidence
        run: npm test

      - name: Check committed migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo '::error::Schema changes require committed migrations. Run npm run db:generate locally and commit packages/db/migrations.'
            git status --short -- packages/db/migrations
            exit 1
          fi

      - name: Validate migrations against a local D1 database
        run: npm run db:migrate:local

      - name: Build web
        run: npm run build

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the repository Actions secret CLOUDFLARE_API_TOKEN before deploying.'
            exit 1
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:remote

      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api

      - name: Deploy web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config apps/web/wrangler.jsonc

      - name: Verify production web, API, and D1
        run: npm run smoke
